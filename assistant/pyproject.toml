[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-assistant-baselines"
version = "0.1.0"
description = "Configurable OpenRouter and local vLLM assistant baselines"
readme = "README_CN.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Optional only: the default BM25 Evo-Memory retriever remains source-runnable
# without installing this large embedding stack.
memory-semantic = ["sentence-transformers>=2.2.0"]

[project.scripts]
assistant-demo = "assistant.cli.demo:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
