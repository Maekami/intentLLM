# Gemini 3.6 Flash minimal-thinking profile with a model-bound Trace2Skill.
# Model, reasoning, generation, and retry settings are identical to the Gemini
# ExpRAG/ReMem experiment profiles; only the agent method differs.
profile_name: gemini_3_6_flash_trace2skill
provider: openrouter
model_id: google/gemini-3.6-flash
base_url: https://openrouter.ai/api/v1

routing:
  require_parameters: true
  allow_fallbacks: true

reasoning:
  # Gemini requires thinking; minimal is its non-thinking approximation.
  enabled: true
  effort: minimal
  exclude_from_response: true

generation:
  assistant:
    temperature: null
    top_p: null
    max_completion_tokens: 65536

retry:
  max_attempts: 3
  initial_backoff_seconds: 1.0
  maximum_backoff_seconds: 8.0

memory: null
skill:
  framework: trace2skill
  # Relative to this model-profile YAML. A canonical 1,000-sample run publishes
  # here atomically; --limit trial runs never modify this path.
  path: ../../runs/skills/gemini_3_6_flash_trace2skill/SKILL.md
