# Local vLLM profile for Qwen3.6-27B with thinking disabled through the
# official chat-template switch. The server command is shared with the
# thinking profile; thinking mode is selected per request.
profile_name: qwen_3_6_27b_vllm_non_thinking
provider: vllm
# Must match `--served-model-name` from `vllm serve`.
model_id: qwen3.6-27b
# ADJUSTABLE: OpenAI-compatible API root, including /v1.
base_url: http://127.0.0.1:8001/v1

routing: {}

reasoning:
  # NON-THINKING PROFILE: Qwen3.6 does not use a /nothink prompt suffix.
  enabled: false
  effort: null
  exclude_from_response: true
  local_chat_template:
    # FIXED HF/vLLM SWITCHES for instruct/non-thinking mode.
    enable_thinking: false
    preserve_thinking: false

generation:
  assistant:
    # FIXED HF RECOMMENDATION: instruct/non-thinking mode.
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
    # ADJUSTABLE: positive integer constrained by the server's --max-model-len
    # after accounting for prompt/history tokens.
    max_completion_tokens: 32768

retry:
  # ADJUSTABLE: integer >= 1. This is the total number of request attempts.
  max_attempts: 3
  # ADJUSTABLE: seconds >= 0.
  initial_backoff_seconds: 1.0
  # ADJUSTABLE: seconds >= initial_backoff_seconds.
  maximum_backoff_seconds: 8.0
