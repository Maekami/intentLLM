# Local-vLLM Qwen3.6-27B non-thinking profile with Evo-Memory ExpRAG enabled.
profile_name: qwen_3_6_27b_exprag
provider: vllm
# Must match `--served-model-name` from the local `vllm serve` command.
model_id: qwen3.6-27b
# Keep aligned with qwen_3_6_27b_vllm_non_thinking.yaml; adjust if the service uses another port.
base_url: http://127.0.0.1:8001/v1

# OpenRouter-only routing options are intentionally empty for local vLLM.
routing: {}

reasoning:
  # Keep exactly aligned with qwen_3_6_27b_vllm_non_thinking.yaml.
  enabled: false
  effort: null
  exclude_from_response: true
  local_chat_template:
    enable_thinking: false
    preserve_thinking: false

generation:
  assistant:
    # Official Qwen instruct/non-thinking sampling parameters.
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
    max_completion_tokens: 32768

retry:
  max_attempts: 3
  initial_backoff_seconds: 1.0
  maximum_backoff_seconds: 8.0

memory:
  # FIXED FOR THIS PROFILE: exprag. Set the entire memory field to null to
  # recover the original memory-free model behavior.
  framework: exprag
  # ADJUSTABLE: relative paths are resolved from this YAML file. Use a distinct
  # file per experiment stream to avoid carrying experience across conditions.
  path: ../../runs/memory/qwen_3_6_27b_exprag.json
  # ADJUSTABLE: kept above 1100 (and above the current 1000-sample dev set),
  # with headroom for seed memories. The official reference default is 1000.
  max_entries: 2000
  # ADJUSTABLE: true drops oldest entries at capacity; false stops adding.
  prune_oldest_when_full: true
  # ADJUSTABLE: true matches the official agent default and only learns from
  # pipeline episodes that terminate successfully.
  store_successful_only: true
  retrieval:
    # OFFICIAL EVO-MEMORY ALIGNMENT: BGE embedding retrieval through
    # sentence-transformers (rather than the dependency-free BM25 fallback).
    backend: sentence_transformers
    # ADJUSTABLE: integer >= 1. The paper/reference default is 4.
    top_k: 4
    # ADJUSTABLE: score >= 0. Score scales differ between the two backends.
    min_score: 0.0
    # ADJUSTABLE: bound the visible, latest-first per-turn retrieval query.
    query_max_characters: 2048
    # USED ONLY by sentence_transformers; this is the reference default model.
    embedding_model: BAAI/bge-base-en-v1.5
    # Keep six independent evo processes off the local assistant GPU. CPU and
    # CUDA use the same BGE/cosine retrieval algorithm.
    device: cpu
    # USED ONLY by bm25.
    bm25_k1: 1.5
    bm25_b: 0.75
  context:
    include_trajectory: true
    include_feedback: true
    # ADJUSTABLE: maximum retrieved-experience characters injected per call.
    max_characters: 8000
  # Parsed for a common schema but unused when framework is exprag.
  remem:
    max_iterations: 10
    enable_pruning: true
