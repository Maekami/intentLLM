# Local-vLLM Qwen3.6-27B non-thinking profile with Evo-Memory ReMem enabled.
profile_name: qwen_3_6_27b_remem
provider: vllm
# Must match `--served-model-name` from the local `vllm serve` command.
model_id: qwen3.6-27b
# Keep aligned with qwen_3_6_27b_vllm_non_thinking.yaml; adjust if the service uses another port.
base_url: http://127.0.0.1:8001/v1

# OpenRouter-only routing options are intentionally empty for local vLLM.
routing: {}

reasoning:
  # Keep exactly aligned with qwen_3_6_27b_vllm_non_thinking.yaml.
  enabled: false
  effort: null
  exclude_from_response: true
  local_chat_template:
    enable_thinking: false
    preserve_thinking: false

generation:
  assistant:
    # Official Qwen instruct/non-thinking sampling parameters.
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
    max_completion_tokens: 32768

retry:
  max_attempts: 3
  initial_backoff_seconds: 1.0
  maximum_backoff_seconds: 8.0

memory:
  # FIXED FOR THIS PROFILE: remem. Set the entire memory field to null to
  # recover the original memory-free model behavior.
  framework: remem
  # ADJUSTABLE: relative paths are resolved from this YAML file. Use a distinct
  # file per experiment stream to avoid carrying experience across conditions.
  path: ../../runs/memory/qwen_3_6_27b_remem.json
  # Kept above 1100 (and above the current 1000-sample dev set), with headroom.
  max_entries: 2000
  prune_oldest_when_full: true
  # ADJUSTABLE: true matches the official agent default.
  store_successful_only: true
  retrieval:
    # OFFICIAL EVO-MEMORY ALIGNMENT: BGE embedding retrieval.
    backend: sentence_transformers
    top_k: 4
    min_score: 0.0
    # Bound the visible, latest-first per-turn retrieval query.
    query_max_characters: 2048
    embedding_model: BAAI/bge-base-en-v1.5
    # Avoid competing with the local Qwen vLLM process for GPU memory.
    device: cpu
    bm25_k1: 1.5
    bm25_b: 0.75
  context:
    include_trajectory: true
    include_feedback: true
    max_characters: 8000
  remem:
    # ADJUSTABLE: 1-100; the reference default is 10. Each iteration can issue
    # one model call, so this directly bounds latency and token cost per reply.
    max_iterations: 10
    # ADJUSTABLE: true allows Think-Prune to remove items from the current
    # interaction's working set; the next turn re-retrieves from the frozen bank.
    enable_pruning: true
