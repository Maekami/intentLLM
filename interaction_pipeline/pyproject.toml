[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reason-dag-interaction-pipeline"
version = "0.1.0"
description = "Automated interaction pipeline for the reason-DAG simulator and assistants"
readme = "README_CN.md"
requires-python = ">=3.11"
dependencies = [
  "reason-dag-user-simulator>=0.1.0",
  "intent-assistant-baselines>=0.1.0",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "rich>=13.8",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
interaction-batch = "interaction_pipeline.cli.batch:app"
interaction-retry-failed = "interaction_pipeline.cli.retry_failed:app"
interaction-evo = "interaction_pipeline.cli.evo:app"
interaction-trace2skill = "interaction_pipeline.cli.trace2skill:app"
interaction-demo = "interaction_pipeline.cli.demo:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
