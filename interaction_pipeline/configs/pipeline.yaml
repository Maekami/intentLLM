projects:
  # Paths are resolved relative to the interaction_pipeline directory.
  simulator_root: ../user_simulator
  assistant_root: ../assistant
  # null loads each project's standard configs/simulator.yaml or assistant.yaml.
  simulator_config: null
  assistant_config: null

run:
  difficulty: hard
  seed: 42
  concurrency: 4
  # Additional full-sample attempts for any failed test/evaluation episode,
  # including turn-limit failures. Evo keeps its independent infrastructure-only policy.
  # 0 disables retries.
  sample_retries: 3
  # Test/evaluation switch. true keeps the historical immediate Evo-Memory update
  # behavior; false retrieves from memory but never writes test episodes back.
  update_memory: true
  output_dir: runs_batch_qwen
  audit_level: full
