[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-evaluation-metrics"
version = "0.1.0"
description = "Offline evaluation metrics for Reason-DAG assistant interactions"
readme = "README_CN.md"
requires-python = ">=3.11"
dependencies = [
  "reason-dag-user-simulator>=0.1.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "rich>=13.8",
  "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
visible-tokens = ["tokenizers>=0.20"]

[project.scripts]
intent-metrics = "intent_metrics.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
