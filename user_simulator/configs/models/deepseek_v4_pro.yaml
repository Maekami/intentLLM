# Profile identifiers are not tuning knobs. Change them only when defining a
# separate profile; `provider` and `base_url` must remain OpenRouter-compatible.
profile_name: deepseek_v4_pro
provider: openrouter
model_id: deepseek/deepseek-v4-pro
base_url: https://openrouter.ai/api/v1

routing:
  # FIXED: keep true so OpenRouter only selects endpoints that support every
  # requested parameter, especially strict JSON Schema response formatting.
  require_parameters: true
  # ADJUSTABLE: true | false. True improves availability by trying another
  # compatible endpoint; false prevents provider fallback.
  allow_fallbacks: true

reasoning:
  # BACKWARD-COMPATIBLE FALLBACK: used only when a generation entry omits its
  # component-level reasoning block.
  enabled: true
  effort: low
  exclude_from_response: true

generation:
  controller:
    # ADJUSTABLE: 0.0-2.0; 0.0-0.3 is recommended for stable structured output.
    temperature: 0.0
    # ADJUSTABLE: positive integer up to the active provider's output limit;
    # 256-8192 is the practical range for this simulator.
    max_completion_tokens: 4096
    reasoning:
      # ADJUSTABLE: true | false; effort is an OpenRouter reasoning-effort value.
      enabled: true
      effort: low
      exclude_from_response: true
  satisfaction:
    # ADJUSTABLE: 0.0-2.0; 0.0-0.3 is recommended for stable structured output.
    temperature: 0.0
    # ADJUSTABLE: positive integer up to the active provider's output limit;
    # 256-8192 is the practical range for this simulator.
    max_completion_tokens: 4096
    reasoning:
      # ADJUSTABLE: true | false; disabled calls omit effort and exclusion.
      enabled: true
      effort: low
      exclude_from_response: true
  realizer_clear:
    # ADJUSTABLE: 0.0-2.0; 0.0-0.7 is recommended for concise natural wording.
    temperature: 0.0
    # ADJUSTABLE: positive integer up to the active provider's output limit;
    # 128-4096 is the practical range for short user messages.
    max_completion_tokens: 4096
    reasoning:
      # Realizer reasoning is intentionally disabled for this baseline.
      enabled: false
  realizer_abstract:
    # ADJUSTABLE: 0.0-2.0; 0.0-0.7 is recommended for concise natural wording.
    temperature: 0.0
    # ADJUSTABLE: positive integer up to the active provider's output limit;
    # 128-4096 is the practical range for short user messages.
    max_completion_tokens: 4096
    reasoning:
      # Realizer reasoning is intentionally disabled for this baseline.
      enabled: false

structured_output:
  # FIXED CONTRACT: keep the first three values unchanged. The client validates
  # every response against the project's strict Pydantic-derived JSON Schema.
  type: json_schema
  strict: true
  require_parameters: true
  # ADJUSTABLE: true | false. Enables OpenRouter's malformed-JSON response
  # healing layer; disabled here to preserve this profile's existing behavior.
  response_healing: false

retry:
  # ADJUSTABLE: integer >= 1; 1-5 is recommended. This is the total attempt count.
  max_attempts: 3
  # ADJUSTABLE: seconds >= 0; 0.1-10.0 is recommended.
  initial_backoff_seconds: 1.0
  # ADJUSTABLE: seconds >= initial_backoff_seconds; 1.0-60.0 is recommended.
  maximum_backoff_seconds: 8.0
